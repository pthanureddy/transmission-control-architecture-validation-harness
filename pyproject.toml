[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tca-sil-test-automation"
version = "1.1.0"
description = "Python and Robot Framework SIL test automation for the synthetic TCA controller"
requires-python = ">=3.11"
dependencies = [
  "cantools==43.0.2",
  "python-can==4.6.1",
  "robotframework==7.4.2",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pip-audit>=2.9,<3",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["python_tests"]
markers = [
  "compiled_dut: requires the CMake-built tca_sil shared library",
]

[tool.coverage.run]
branch = true
source = ["tca_sil"]
omit = [
  "python/tca_sil/bridge.py",
  "python/tca_sil/robot_library.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tca_sil"]
mypy_path = "python"

[[tool.mypy.overrides]]
module = ["can.*", "cantools.*"]
ignore_missing_imports = true
